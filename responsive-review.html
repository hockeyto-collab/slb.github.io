<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,nosnippet"><title>Responsive review</title><style>body{font:15px system-ui;margin:0;background:#e7ebee;color:#102b42}header{padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:white;position:sticky;top:0;z-index:2}label{display:flex;gap:8px;align-items:center}select{padding:8px;font:inherit}main{overflow:auto;padding:16px}iframe{display:block;background:white;border:1px solid #bac8cc;height:850px;margin:0 auto}h1{font-size:16px;margin:0}</style></head><body><header><h1>화면 점검</h1><label>페이지<select id="review-page"><option value="publication.html">연구</option><option value="media.html">언론·기고</option><option value="magazine.html">매거진</option><option value="index.html">홈</option></select></label><label>화면 너비<select id="review-width"><option value="320">320</option><option value="390">390</option><option value="768">768</option><option value="1024">1024</option><option value="1280" selected>1280</option></select></label></header><main><iframe id="review-frame" title="홈페이지 반응형 점검" src="publication.html" style="width:1280px"></iframe></main><script>const frame=document.getElementById('review-frame');document.getElementById('review-page').addEventListener('change',e=>{frame.src=e.target.value});document.getElementById('review-width').addEventListener('change',e=>{frame.style.width=e.target.value+'px'});</script></body></html>

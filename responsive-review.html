<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>레이아웃 확인</title><style>body{margin:0;background:#e8edf0;color:#122c40;font:16px/1.5 system-ui,sans-serif}header{padding:16px 24px;background:#fff;display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-bottom:1px solid #bccbd0}label{display:flex;align-items:center;gap:10px}select{font:inherit;padding:8px;border:1px solid #8298a4;background:white;color:inherit}main{padding:24px;overflow:auto}iframe{display:block;width:390px;height:1100px;max-width:none;border:1px solid #8298a4;background:white;margin:auto}p{margin:0;font-size:14px}a{color:inherit}</style></head><body><header><label>페이지<select id="review-page"><option value="index.html">홈</option><option value="education.html">교육</option><option value="consulting.html">컨설팅</option><option value="publication.html">연구</option><option value="magazine.html">매거진</option><option value="lecture.html">강연</option><option value="media.html">미디어</option><option value="contact.html">문의</option></select></label><label>화면 폭<select id="review-width"><option value="320">320</option><option value="390" selected>390</option><option value="768">768</option><option value="1024">1024</option><option value="1280">1280</option></select></label><p>공개 페이지의 반응형 레이아웃 확인</p></header><main><iframe id="review-frame" src="index.html" title="페이지 레이아웃 확인" allow="clipboard-write"></iframe></main><script>const frame=document.getElementById('review-frame');document.getElementById('review-page').addEventListener('change',function(){frame.src=this.value;});document.getElementById('review-width').addEventListener('change',function(){frame.style.width=this.value+'px';});</script></body></html>
